services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowresearch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowresearch}
      POSTGRES_USER: ${POSTGRES_USER:-knowresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowresearch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-knowresearch} -d ${POSTGRES_DB:-knowresearch}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: knowresearch-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
